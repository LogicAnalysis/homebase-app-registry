---
services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.2
    container_name: filebrowser
    env_file:
      - preInstallData.env
    volumes:
      - /app/data/apps/storage:/srv
      - /app/data/apps/media:/media
      - ./filebrowser.db:/database.db
      - ./settings.json:/config.json
    ports:
      - 2980:80
    restart: unless-stopped
